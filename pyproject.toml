[project]
name = "transaction-ledger-api"
version = "1.0.0"
description = "Transaction Ledger API - accounts, credit/debit transactions, balances, history and atomic transfers."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
